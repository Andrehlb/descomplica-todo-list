<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f6f7fb"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16213e">Mapa mental — altura e largura do layout Celestial</text>
  <text x="40" y="82" font-family="Arial, sans-serif" font-size="16" fill="#667085">Página: body • header • app-layout • 3 colunas • cards</text>

  <!-- Page shell -->
  <rect x="40" y="110" width="1320" height="650" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="40" y="110" width="1320" height="70" rx="18" fill="#ece8ff"/>
  <rect x="40" y="162" width="1320" height="18" fill="#ece8ff"/>
  <text x="700" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4338ca">header (altura automática)</text>

  <!-- Grid app layout -->
  <rect x="60" y="198" width="1280" height="540" rx="12" fill="#f1f5f9" stroke="#3b82f6" stroke-width="3"/>
  <text x="700" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">.app-layout — grid-template-columns</text>

  <!-- columns -->
  <rect x="72" y="245" width="282" height="470" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="213" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">.layout-left — 22fr</text>

  <rect x="360" y="245" width="665" height="470" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="693" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">.layout-center — 52fr</text>

  <rect x="1031" y="245" width="297" height="470" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="1180" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#be185d">.layout-right — 26fr</text>

  <!-- left card 1 -->
  <rect x="88" y="300" width="250" height="225" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
  <text x="213" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">.task-card</text>
  <line x="213" y="340" x2="213" y2="525" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6 5"/>
  <line x="88" y="412" x2="338" y2="412" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="213" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">COMPRIMENTO = altura</text>
  <text x="213" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">LARGURA = coluna</text>

  <!-- left card 2 -->
  <rect x="88" y="545" width="250" height="145" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="213" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">.energy-guide</text>
  <text x="213" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c2d12">gap e padding controlam</text>
  <text x="213" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c2d12">o espaço entre os cards</text>

  <!-- center -->
  <rect x="390" y="300" width="605" height="390" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="693" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Cenário central</text>
  <text x="693" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">.layout-center</text>

  <!-- right -->
  <rect x="1047" y="300" width="265" height="175" rx="14" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="1180" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9d174d">Minhas tarefas</text>
  <rect x="1047" y="490" width="265" height="145" rx="14" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="1180" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9d174d">Meu progresso</text>

  <!-- callout bottom -->
  <rect x="40" y="790" width="1320" height="82" rx="14" fill="#16213e"/>
  <text x="60" y="819" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">1º ajustar altura:</text>
  <text x="245" y="819" font-family="monospace" font-size="15" fill="#ffffff">.layout-left .task-card { flex: 0 0 auto; padding: 8px 12px; }</text>
  <text x="60" y="852" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#93c5fd">2º ajustar largura:</text>
  <text x="245" y="852" font-family="monospace" font-size="15" fill="#ffffff">grid-template-columns: 22fr 52fr 26fr;</text>
</svg>
